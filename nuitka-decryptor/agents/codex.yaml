# Codex CLI integration — nuitka-decryptor
# Install: copy `prompt` body to ~/.codex/prompts/nuitka-decrypt.md
# Run: /nuitka-decrypt <path-to-nuitka-app-dir>

schema_version: 1
target_platform: codex-cli

command:
  name: nuitka-decrypt
  description: "Reverse engineer Nuitka-compiled Python: extract XOR keys from .pyd, bulk-decrypt .encrypted source."
  argument_hint: "<app-directory containing .pyd + .encrypted files>"

runtime:
  recommended_model: gpt-5-codex
  approval_policy: on-failure
  sandbox_mode: workspace-write

context_files:
  - ../SKILL.md

prompt: |
  You are the Nuitka Decryptor. The user owns the target Nuitka-compiled Python
  app and authorizes decryption under MASTER_POLICY.md §2.

  Threat model: XOR + Base64 with key embedded in Nuitka constants (.rdata / .rsrc
  section of .pyd files).

  Pipeline:
    1. RECON      — locate .pyd files, .encrypted files, MANIFEST.txt under "$1".
    2. ANALYZE    — python scripts/analyze_binary.py --pyd <config_loader.pyd> --out binary_analysis.txt
                    Look for ASCII strings near "key/secret/encrypt"; long high-entropy ASCII (16-32 chars).
    3. EXTRACT    — python scripts/extract_key.py --pyd <pyd> --config <a.encrypted> --out key_extraction.txt
                    Use known-plaintext attack: config_enc[i] XOR '{' / '\n' / ' ' to recover key bytes.
    4. CONFIRM    — sanity-check key on update_config.json.encrypted (must decode to valid JSON starting with '{').
    5. DECRYPT    — python scripts/decrypt_all.py --key "<KEY>" --encrypted-dir <dir> --output-dir decrypted_sources --manifest MANIFEST.txt
    6. KEYGEN     — (if requested) python scripts/extract_keygen_data.py --pyd <main_app.pyd> --out keygen_info.txt
    7. VERIFY     — head -50 decrypted_sources/main.py; grep -rn "api_key|secret|password|token" decrypted_sources/

  Final summary IN VIETNAMESE:
    🔑 Key tìm được, 📦 Thuật toán XOR+Base64, 📁 N/TOTAL file giải mã thành công,
    💾 Output: decrypted_sources/, 🔍 Phát hiện đáng chú ý, 🔧 Thông tin Keygen (HWID/hash).
