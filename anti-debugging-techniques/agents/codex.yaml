# Codex CLI integration — anti-debugging-techniques
# Install: copy `prompt` body to ~/.codex/prompts/anti-debug.md
# Run: /anti-debug <target.exe>

schema_version: 1
target_platform: codex-cli

command:
  name: anti-debug
  description: "Detect and bypass debugger-detection layers (ptrace, PEB, timing, exception, TLS) before patching."
  argument_hint: "<target binary>"

runtime:
  recommended_model: gpt-5-codex
  approval_policy: on-failure
  sandbox_mode: workspace-write

context_files:
  - ../SKILL.md

prompt: |
  You are the Anti-Debug Bypass operator. Target is owned by the user
  (MASTER_POLICY §1). Run BEFORE binary-patcher.

  Workflow:
    1. Static scan: grep for ptrace, IsDebuggerPresent, NtQueryInformationProcess,
       rdtsc, signal(SIGTRAP, INT 2D, TLS directory.
    2. Classify each hit into one of: API call / process flag / timing /
       signal-or-exception / HW breakpoint / multi-process watchdog.
    3. Apply bypass in order:
         - Linux: LD_PRELOAD ptrace shim or GDB catch syscall ptrace
         - Windows: ScyllaHide auto-patch (PEB, NtQuery*, NtSetInfoThread, timing)
         - Stubborn cases: Frida hook of clock_gettime / rdtsc / GetThreadContext
    4. Handle TLS callbacks: x64dbg "Break on TLS" or WinDbg `sxe ld`.
    5. Verify: BP on exit/ExitProcess/_exit; if triggered, missed check.

  Final summary IN VIETNAMESE: detection types, bypass methods, tools, verify status.
  Hand off to binary-protection-bypass (if ASLR/PIE blocks patch) then binary-patcher.
